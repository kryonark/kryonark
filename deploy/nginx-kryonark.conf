# /etc/nginx/conf.d/kryonark.xyz.conf
# TLS arrives through the SNI router on :443 (stream block), which forwards unknown names to 127.0.0.1:8443 with PROXY protocol.
server {
    listen 80;
    listen [::]:80;
    server_name kryonark.xyz www.kryonark.xyz;
    location /.well-known/acme-challenge/ { root /var/www/kryonark-acme; }
    location / { return 301 https://kryonark.xyz$request_uri; }
}

server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name kryonark.xyz www.kryonark.xyz;
    ssl_certificate /etc/letsencrypt/live/kryonark.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kryonark.xyz/privkey.pem;

    if ($host = www.kryonark.xyz) { return 301 https://kryonark.xyz$request_uri; }

    root /var/www/kryonark/web;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # owner panel + its public token API (kryonark-studio on :5830)
    location ^~ /studio {
        proxy_pass http://127.0.0.1:5830;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /assets/ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
    location = /assets/app.js { expires -1; add_header Cache-Control "no-cache"; }
    location = /assets/style.css { expires -1; add_header Cache-Control "no-cache"; }
    location = /assets/cube3d.js { expires -1; add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ =404; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
